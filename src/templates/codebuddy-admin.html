<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CodeBuddy 管理面板</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                background: #f5f7fa;
                color: #333;
                line-height: 1.6;
            }
            .container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
            }
            header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 20px 30px;
                margin-bottom: 30px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            header h1 {
                font-size: 1.5rem;
            }
            .header-right {
                display: flex;
                align-items: center;
                gap: 16px;
            }
            .card {
                background: white;
                border-radius: 12px;
                padding: 24px;
                margin-bottom: 20px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            }
            .card h2 {
                color: #667eea;
                margin-bottom: 16px;
                font-size: 1.15rem;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 10px 20px;
                border: none;
                border-radius: 8px;
                font-size: 0.9rem;
                cursor: pointer;
                transition: all 0.3s ease;
                font-weight: 500;
            }
            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }
            .btn-primary:hover {
                transform: translateY(-1px);
                box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            }
            .btn-danger {
                background: #ef4444;
                color: white;
            }
            .btn-danger:hover {
                background: #dc2626;
            }
            .btn-secondary {
                background: #f3f4f6;
                color: #374151;
            }
            .btn-secondary:hover {
                background: #e5e7eb;
            }
            .btn-warning {
                background: #f59e0b;
                color: white;
            }
            .btn-warning:hover {
                background: #d97706;
            }
            .btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }
            .btn-small {
                padding: 6px 12px;
                font-size: 0.8rem;
                white-space: nowrap;
                line-height: 1.4;
            }
            .auth-box {
                background: #f8fafc;
                border: 2px dashed #cbd5e1;
                border-radius: 12px;
                padding: 30px;
                text-align: center;
            }
            .auth-box.active {
                border-color: #667eea;
                background: #eef2ff;
            }
            .auth-link {
                display: inline-block;
                background: #667eea;
                color: white;
                padding: 10px 20px;
                border-radius: 8px;
                text-decoration: none;
                margin: 10px 0;
                word-break: break-all;
                font-size: 0.85rem;
            }
            .auth-link:hover {
                background: #5a67d8;
            }
            .credential-list {
                list-style: none;
            }
            .credential-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 14px 16px;
                background: #f8fafc;
                border-radius: 8px;
                margin-bottom: 10px;
                border-left: 4px solid #667eea;
            }
            .credential-item.expired {
                border-left-color: #ef4444;
                opacity: 0.7;
            }
            .credential-item.disabled {
                border-left-color: #f59e0b;
                opacity: 0.6;
            }
            .credential-item.domain-blocked {
                border-left-color: #dc2626;
                opacity: 0.5;
                background: repeating-linear-gradient(
                    -45deg,
                    transparent,
                    transparent 8px,
                    rgba(220, 38, 38, 0.06) 8px,
                    rgba(220, 38, 38, 0.06) 16px
                );
            }
            .credential-item.active-credential {
                border-left-color: #10b981;
                background: #f0fdf4;
            }
            .credential-item.rate-limited {
                border-left-color: #8b5cf6;
            }
            .badge-ratelimit {
                background: #8b5cf6;
                color: #fff;
                font-size: 0.7rem;
                padding: 2px 8px;
                border-radius: 10px;
                margin-left: 8px;
            }
            .badge-modellock {
                background: #f59e0b;
                color: #fff;
                font-size: 0.7rem;
                padding: 2px 8px;
                border-radius: 10px;
                margin-left: 6px;
            }
            /* 拖动排序：手柄独立成一块，不与「置顶/禁用」等按钮抢点击区域。
               inline-block 是必须的：inline 元素的拖拽热区只有字形本身，很难按住。 */
            .drag-handle {
                cursor: grab;
                color: #9ca3af;
                font-size: 1.15rem;
                line-height: 1;
                padding: 8px 6px;
                user-select: none;
                -webkit-user-select: none;
                display: inline-block;
                flex: 0 0 auto;
                border-radius: 4px;
                transition: background 0.15s, color 0.15s;
            }
            .drag-handle:hover {
                background: #e5e7eb;
                color: #4b5563;
            }
            .drag-handle:active { cursor: grabbing; }
            .credential-item.dragging { opacity: 0.45; }
            .credential-item.drop-above { box-shadow: 0 -3px 0 #667eea; }
            .credential-item.drop-below { box-shadow: 0 3px 0 #667eea; }
            /* 优先级序号：一眼看出谁排第几 */
            .priority-rank {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 20px;
                height: 20px;
                border-radius: 50%;
                background: #e5e7eb;
                color: #4b5563;
                font-size: 0.7rem;
                font-weight: 600;
                margin-right: 8px;
                vertical-align: middle;
            }
            .priority-rank.top { background: #667eea; color: #fff; }
            /* 额度进度条：按剩余比例收窄，低于阈值换色 */
            .quota-bar {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 6px;
            }
            .quota-track {
                flex: 1;
                height: 8px;
                background: #e5e7eb;
                border-radius: 4px;
                overflow: hidden;
                min-width: 80px;
            }
            .quota-fill {
                height: 100%;
                border-radius: 4px;
                transition: width 0.3s ease;
            }
            .quota-pct {
                font-size: 0.75rem;
                color: #6b7280;
                min-width: 58px;
                text-align: right;
                font-variant-numeric: tabular-nums;
            }
            /* 额度总览：四张指标卡并排，窄屏自动折行 */
            .quota-overview {
                padding: 14px 16px;
                background: #f8fafc;
                border: 1px solid #e5e7eb;
                border-radius: 8px;
                margin-bottom: 14px;
            }
            .metric-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 12px;
            }
            .metric-card {
                background: #fff;
                border: 1px solid #e5e7eb;
                border-radius: 6px;
                padding: 10px 12px;
            }
            .metric-value {
                font-size: 1.15rem;
                font-weight: 700;
                color: #1f2937;
                font-variant-numeric: tabular-nums;
                line-height: 1.2;
            }
            .metric-label {
                font-size: 0.72rem;
                color: #6b7280;
                margin-top: 2px;
            }
            .metric-hint {
                font-size: 0.68rem;
                color: #9ca3af;
                margin-top: 3px;
                line-height: 1.3;
            }
            /* 站点分组标题：国内站/国际站的积分是两套账，各自成块，不跨站合计 */
            .realm-head {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 10px;
            }
            .realm-head strong {
                font-size: 0.9rem;
                color: #1f2937;
            }
            .realm-head span {
                font-size: 0.72rem;
                color: #9ca3af;
            }
            .badge-realm {
                background: #e5e7eb;
                color: #4b5563;
                font-size: 0.7rem;
                padding: 2px 8px;
                border-radius: 10px;
            }
            /* 模型列表按站点分块：两边的模型集合与倍率都不一样，不能混成一张表 */
            .model-realm {
                padding: 12px 14px;
                border: 1px solid #e5e7eb;
                border-radius: 8px;
                background: #fafbfc;
                margin-bottom: 12px;
            }
            .model-realm:last-child {
                margin-bottom: 0;
            }
            /* 到期倒计时：3 天内红、7 天内黄 */
            .badge-expiry {
                background: #e5e7eb;
                color: #4b5563;
                font-size: 0.68rem;
                padding: 2px 8px;
                border-radius: 10px;
                margin-left: 6px;
                font-weight: 500;
                white-space: nowrap;
            }
            .badge-expiry.warn {
                background: #fef3c7;
                color: #92400e;
            }
            .badge-expiry.urgent {
                background: #fee2e2;
                color: #991b1b;
            }
            .credential-info h4 {
                color: #1f2937;
                margin-bottom: 2px;
                font-size: 0.95rem;
            }
            .credential-info p {
                color: #6b7280;
                font-size: 0.8rem;
            }
            .loading {
                display: inline-block;
                width: 18px;
                height: 18px;
                border: 3px solid #f3f3f3;
                border-top: 3px solid #667eea;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
            .toast {
                position: fixed;
                bottom: 20px;
                right: 20px;
                padding: 14px 22px;
                border-radius: 8px;
                color: white;
                font-weight: 500;
                transform: translateY(100px);
                opacity: 0;
                transition: all 0.3s ease;
                z-index: 1000;
            }
            .toast.show {
                transform: translateY(0);
                opacity: 1;
            }
            .toast.success {
                background: #10b981;
            }
            .toast.error {
                background: #ef4444;
            }
            .empty-state {
                text-align: center;
                padding: 30px;
                color: #9ca3af;
            }
            .config-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 0;
                border-bottom: 1px solid #e5e7eb;
            }
            .config-row:last-child {
                border-bottom: none;
            }
            .config-label {
                font-weight: 500;
                color: #374151;
            }
            .config-label p {
                color: #6b7280;
                font-size: 0.8rem;
                font-weight: normal;
                margin-top: 2px;
            }
            .config-control {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .api-key-display {
                background: #f1f5f9;
                padding: 14px 18px;
                border-radius: 8px;
                font-family: monospace;
                font-size: 0.9rem;
                word-break: break-all;
                border: 2px solid #667eea;
                color: #374151;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .api-key-text {
                flex: 1;
                word-break: break-all;
            }
            .api-key-actions {
                display: flex;
                gap: 6px;
                flex-shrink: 0;
            }
            .btn-icon {
                padding: 6px 10px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.8rem;
                transition: all 0.2s;
                background: #e5e7eb;
                color: #374151;
            }
            .btn-icon:hover {
                background: #d1d5db;
            }
            .btn-icon.copy-success {
                background: #10b981;
                color: white;
            }
            .cred-count-badge {
                background: #667eea;
                color: white;
                font-size: 0.75rem;
                padding: 2px 10px;
                border-radius: 12px;
                margin-left: 8px;
                vertical-align: middle;
                font-weight: 600;
            }
            .cred-count-badge.zero {
                background: #ef4444;
            }
            .stats-grid {
                display: grid;
                grid-template-columns: repeat(6, 1fr);
                gap: 12px;
            }
            .stat-item {
                background: #f8fafc;
                border-radius: 8px;
                padding: 16px;
                text-align: center;
            }
            .stat-value {
                font-size: 1.5rem;
                font-weight: 700;
                color: #667eea;
                line-height: 1.2;
            }
            .stat-label {
                font-size: 0.85rem;
                color: #6b7280;
                margin-top: 6px;
            }
            .usage-card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 16px;
            }
            .usage-card-header h2 {
                margin-bottom: 0;
            }
            .month-select {
                padding: 6px 12px;
                border: 1px solid #d1d5db;
                border-radius: 6px;
                font-size: 0.85rem;
                color: #374151;
                background: white;
                cursor: pointer;
                outline: none;
            }
            .month-select:focus {
                border-color: #667eea;
            }
            .chart-container {
                width: 100%;
                height: 280px;
                margin-top: 16px;
            }

            /* 使用指南样式 */
            .guide-steps {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }
            .guide-step {
                display: flex;
                gap: 14px;
                align-items: flex-start;
            }
            .guide-step-num {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                font-weight: 700;
                font-size: 0.85rem;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            }
            .guide-step-body {
                flex: 1;
            }
            .guide-step-title {
                font-weight: 600;
                color: #1f2937;
                margin-bottom: 4px;
                font-size: 0.95rem;
            }
            .guide-step-desc {
                font-size: 0.85rem;
                color: #6b7280;
                line-height: 1.5;
            }
            .guide-step-desc code {
                background: #f1f5f9;
                padding: 1px 6px;
                border-radius: 4px;
                font-size: 0.82rem;
                color: #7c3aed;
            }
            .guide-model-table {
                width: 100%;
                table-layout: fixed;
                border-collapse: collapse;
                margin-top: 6px;
                font-size: 0.82rem;
            }
            .guide-model-table th {
                background: #f1f5f9;
                padding: 6px 10px;
                text-align: left;
                border-bottom: 1px solid #e2e8f0;
                font-weight: 600;
                color: #374151;
            }
            .guide-model-table th:nth-child(1) {
                width: 38%;
            }
            .guide-model-table th:nth-child(2) {
                width: 32%;
            }
            /* 最后两列（倍率、可用性）居中且等宽：四列表格里
               nth-last-child 比 nth-child 更稳，加列时不用改这里 */
            .guide-model-table th:nth-last-child(-n+2) {
                text-align: center;
                width: 15%;
            }
            .guide-model-table td {
                padding: 5px 10px;
                border-bottom: 1px solid #f1f5f9;
                color: #4b5563;
            }
            .guide-model-table td:nth-last-child(-n+2) {
                text-align: center;
            }
            .guide-model-table tbody tr:nth-child(even) {
                background: #f8fafc;
            }
            .guide-model-table td code {
                font-size: 0.78rem;
            }
            .guide-code-block {
                position: relative;
                background: #1e293b;
                border-radius: 8px;
                margin-top: 8px;
                overflow: hidden;
            }
            .guide-code-block pre {
                margin: 0;
                padding: 14px 18px;
                padding-right: 48px;
                color: #e2e8f0;
                font-size: 0.82rem;
                font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
                line-height: 1.6;
                overflow-x: auto;
                white-space: pre;
            }
            .guide-copy-btn {
                position: absolute;
                top: 8px;
                right: 8px;
                background: rgba(255, 255, 255, 0.1);
                color: #e2e8f0;
                border: none;
            }
            .guide-copy-btn:hover {
                background: rgba(255, 255, 255, 0.2);
            }
        </style>
        <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>CodeBuddy 管理面板</h1>
                <div class="header-right"></div>
            </header>

            <div id="mainContent">
                <div class="empty-state">
                    <div class="loading"></div>
                    <p>加载中...</p>
                </div>
            </div>
        </div>

        <div id="toast" class="toast"></div>

        <!-- 模型可用性测试弹窗：逐条显示每个模型的探测结果 -->
        <div id="modelTestModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;z-index:1000;">
            <div style="background:#fff;border-radius:12px;padding:22px 24px;max-width:720px;width:94%;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,0.2);">
                <h3 id="modelTestTitle" style="margin:0 0 6px;font-size:1.05rem;color:#374151;"></h3>
                <p id="modelTestSubtitle" style="margin:0 0 12px;font-size:0.8rem;color:#6b7280;"></p>
                <div id="modelTestProgress" style="height:4px;background:#e5e7eb;border-radius:2px;margin-bottom:12px;overflow:hidden;">
                    <div id="modelTestProgressBar" style="height:100%;width:0;background:#667eea;transition:width 0.2s;"></div>
                </div>
                <div id="modelTestBody" style="flex:1;overflow:auto;min-height:120px;"></div>
                <div id="modelTestSummary" style="margin-top:12px;font-size:0.85rem;color:#374151;"></div>
                <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;align-items:center;">
                    <span id="modelTestCostHint" style="margin-right:auto;font-size:0.78rem;color:#6b7280;"></span>
                    <button class="btn btn-secondary" onclick="closeModelTest()">关闭</button>
                    <button class="btn btn-primary" id="modelTestStartBtn" style="display:none;" onclick="startModelTest()">开始测试</button>
                </div>
            </div>
        </div>

        <!-- 账号权限弹窗：勾选这个 API Key 能使用哪些 CodeBuddy 账号 -->
        <div id="keyScopeModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);align-items:center;justify-content:center;z-index:1000;">
            <div style="background:#fff;border-radius:12px;padding:22px 24px;max-width:560px;width:92%;max-height:82vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,0.2);">
                <h3 id="keyScopeTitle" style="margin:0 0 14px;font-size:1.05rem;color:#374151;"></h3>
                <div id="keyScopeBody"></div>
                <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;">
                    <button class="btn btn-secondary" onclick="closeKeyScopeModal()">取消</button>
                    <button class="btn btn-primary" onclick="saveKeyScope()">保存</button>
                </div>
            </div>
        </div>

        <script>
            const API_BASE = '/codebuddyFE';
            let currentAuthState = null;
            let pollInterval = null;
            let manualSelectedIndex = null;
            let apiKeyPlain = '';
            let apiKeyMasked = '';
            /** @type {Array<Object>} 面板展示用的 Key 列表 */
            let apiKeys = [];
            /** @type {Set<string>} 明文展开状态（按 key id） */
            const apiKeyRevealed = new Set();
            let totalCredentials = 0;
            let editingKeyId = null;
            /** 当前正在测试的账号索引 / 取消句柄 */
            let modelTestIndex = null;
            let modelTestAbort = null;
            /** 当前账号可测的模型清单（弹窗打开时拉一次，只读不计费） */
            let modelTestModels = [];
            /** 成长中心数据（只有猫猫旅行状态），合并进积分板块展示 */
            let growthCache = [];
            let currentMonth = '';
            let apiCallsChartInstance = null;
            let tokensChartInstance = null;
            let creditChartInstance = null;

            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = 'toast ' + type;
                toast.classList.add('show');
                const duration = type === 'error' ? 8000 : 3000;
                setTimeout(() => toast.classList.remove('show'), duration);
            }

            async function loadMyTenant() {
                try {
                    const response = await fetch(API_BASE + '/status');
                    const data = await response.json();
                    manualSelectedIndex = data.manualSelectedIndex;

                    // Render the page with status data
                    renderTenantPage({
                        apiKeyPrefix: data.apiKeyPrefix,
                        apiKeyPlain: data.apiKeyPlain,
                        credentialCount: data.credentialCount,
                        hasCredentials: data.hasCredentials,
                        customApiCallCount: data.usage?.custom_api_call_count || 0,
                        customInputTokens: data.usage?.custom_input_tokens || 0,
                        customOutputTokens: data.usage?.custom_output_tokens || 0,
                        customCacheHitTokens: data.usage?.custom_cache_hit_tokens || 0,
                        customCredit: data.usage?.custom_credit || 0,
                        cluster: data.cluster
                    });

                    loadCredentials();
                    loadApiKeys();
                    refreshBilling();
                    loadModels();
                    startStatsAutoRefresh();
                    currentMonth = getCurrentMonth();
                    loadAvailableMonths();
                    await loadDailyChartData();
                } catch (error) {
                    showToast('加载信息失败: ' + error.message, 'error');
                }
            }

            function formatStat(n) {
                if (n >= 100000000) return (n / 100000000).toFixed(2) + '亿';
                if (n >= 10000) return (n / 10000).toFixed(2) + '万';
                return new Intl.NumberFormat('zh-CN').format(n);
            }

            function formatNumber(n) {
                return new Intl.NumberFormat('zh-CN').format(n);
            }

            function getCurrentMonth() {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            }

            function loadAvailableMonths() {
                const select = document.getElementById('monthSelect');
                if (!select) return;
                const now = new Date();
                const months = [];
                for (let i = 0; i < 3; i++) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    months.push(key);
                }
                select.innerHTML = months
                    .map((m) => {
                        const [y, mo] = m.split('-');
                        return `<option value="${m}"${m === currentMonth ? ' selected' : ''}>${y} - ${parseInt(mo)}月</option>`;
                    })
                    .join('');
            }

            async function onMonthChange() {
                const select = document.getElementById('monthSelect');
                if (select) {
                    currentMonth = select.value;
                }
                await loadDailyChartData();
            }

            async function loadDailyChartData() {
                if (!currentMonth) return;
                try {
                    const response = await fetch(
                        `/codebuddyFE/stats/daily?month=${currentMonth}`
                    );
                    const result = await response.json();
                    renderCharts(result.data || {}, currentMonth);
                } catch (error) {
                    console.error('加载每日数据失败:', error);
                }
            }

            function getDaysInMonth(monthKey) {
                const [year, month] = monthKey.split('-').map(Number);
                return new Date(year, month, 0).getDate();
            }

            function renderCharts(dailyData, monthKey) {
                let daysInMonth = getDaysInMonth(monthKey);
                const now = new Date();
                const curMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                if (monthKey === curMonth) {
                    daysInMonth = Math.min(daysInMonth, now.getDate());
                }
                const dates = [];
                const apiCallsData = [];
                const inputTokensData = [];
                const outputTokensData = [];
                const cacheHitTokensData = [];
                const creditData = [];

                for (let d = 1; d <= daysInMonth; d++) {
                    const dayKey = String(d).padStart(2, '0');
                    const dayData = dailyData[dayKey] || {
                        api_calls: 0,
                        input_tokens: 0,
                        output_tokens: 0,
                        cache_hit_tokens: 0,
                        credit: 0
                    };
                    dates.push(d);
                    apiCallsData.push(dayData.api_calls);
                    inputTokensData.push(dayData.input_tokens);
                    outputTokensData.push(dayData.output_tokens);
                    cacheHitTokensData.push(dayData.cache_hit_tokens || 0);
                    creditData.push(dayData.credit || 0);
                }

                // 按月份聚合更新统计卡片
                const totalApiCalls = apiCallsData.reduce((s, v) => s + v, 0);
                const totalInputTokens = inputTokensData.reduce((s, v) => s + v, 0);
                const totalOutputTokens = outputTokensData.reduce((s, v) => s + v, 0);
                const totalTokens = totalInputTokens + totalOutputTokens;
                const totalCacheHitTokens = cacheHitTokensData.reduce((s, v) => s + v, 0);
                const totalCredit = creditData.reduce((s, v) => s + v, 0);
                const callEl = document.getElementById('apiCallCount');
                if (callEl) {
                    callEl.textContent = formatStat(totalApiCalls);
                    callEl.title = new Intl.NumberFormat('zh-CN').format(totalApiCalls);
                }
                const inEl = document.getElementById('inputTokensCount');
                if (inEl) {
                    inEl.textContent = formatStat(totalInputTokens);
                    inEl.title = new Intl.NumberFormat('zh-CN').format(totalInputTokens);
                }
                const outEl = document.getElementById('outputTokensCount');
                if (outEl) {
                    outEl.textContent = formatStat(totalOutputTokens);
                    outEl.title = new Intl.NumberFormat('zh-CN').format(totalOutputTokens);
                }
                const cacheHitEl = document.getElementById('cacheHitTokensCount');
                if (cacheHitEl) {
                    cacheHitEl.textContent = formatStat(totalCacheHitTokens);
                    cacheHitEl.title = new Intl.NumberFormat('zh-CN').format(totalCacheHitTokens);
                }
                const cacheRateEl = document.getElementById('cacheHitRate');
                if (cacheRateEl) {
                    const cacheRate =
                        totalInputTokens > 0 ? Math.min(100, Math.round((totalCacheHitTokens / totalInputTokens) * 100)) : 0;
                    cacheRateEl.textContent = cacheRate + '%';
                    cacheRateEl.title = cacheRate + '%';
                }
                const creditEl = document.getElementById('creditCount');
                if (creditEl) {
                    creditEl.textContent = totalCredit.toFixed(2);
                    creditEl.title = totalCredit.toFixed(2);
                }

                // 折线图 - API请求次数
                const apiCallsEl = document.getElementById('apiCallsChart');
                if (apiCallsEl) {
                    if (!apiCallsChartInstance) {
                        apiCallsChartInstance = echarts.init(apiCallsEl);
                    }
                    apiCallsChartInstance.setOption(
                        {
                            title: {text: 'API 请求次数', left: 'left', textStyle: {fontSize: 14, color: '#374151'}},
                            tooltip: {
                                trigger: 'axis',
                                formatter: function (params) {
                                    const p = params[0];
                                    const day = String(p.dataIndex + 1).padStart(2, '0');
                                    return `<b>${monthKey}-${day}</b><br/>请求次数 ${p.value}`;
                                }
                            },
                            grid: {left: '50px', right: '30px', top: '70px', bottom: '30px'},
                            xAxis: {type: 'category', data: dates, name: '日', axisLabel: {fontSize: 11}},
                            yAxis: {type: 'value', name: '次', axisLabel: {fontSize: 11}, splitNumber: 2},
                            series: [
                                {
                                    type: 'line',
                                    data: apiCallsData,
                                    smooth: true,
                                    showSymbol: false,
                                    emphasis: {focus: 'series', itemStyle: {color: '#667eea'}},
                                    areaStyle: {opacity: 0.15},
                                    lineStyle: {color: '#667eea', width: 2},
                                    itemStyle: {color: '#667eea'}
                                }
                            ]
                        },
                        true
                    );
                }

                // 柱状图 - Tokens（堆叠：缓存命中/未命中/输出）
                const tokensEl = document.getElementById('tokensChart');
                if (tokensEl) {
                    if (!tokensChartInstance) {
                        tokensChartInstance = echarts.init(tokensEl);
                    }
                    tokensChartInstance.setOption(
                        {
                            title: {text: 'Tokens 使用量', left: 'left', textStyle: {fontSize: 14, color: '#374151'}},
                            tooltip: {
                                trigger: 'axis',
                                extraCssText: 'min-width: 300px',
                                formatter: function (params) {
                                    const day = String(params[0].dataIndex + 1).padStart(2, '0');
                                    const barColors = ['#a0dcfd', '#60b3fe', '#0c70f3'];
                                    const totalAll = params.reduce((s, p) => s + p.value, 0);
                                    let tip = `<div style="display:flex;justify-content:space-between"><b>${monthKey}-${day}</b><b>${formatNumber(totalAll)} tokens</b></div>`;
                                    params.forEach((p, i) => {
                                        tip += `<div style="display:flex;justify-content:space-between;align-items:center"><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${barColors[i]};margin-right:4px;vertical-align:middle"></span>${p.seriesName}</span><span>${formatNumber(p.value)} tokens</span></div>`;
                                    });
                                    return tip;
                                }
                            },
                            legend: {
                                data: ['输入(命中缓存)', '输入(未命中缓存)', '输出'],
                                top: '30px',
                                right: '0',
                                textStyle: {fontSize: 12}
                            },
                            grid: {left: '80px', right: '30px', top: '70px', bottom: '30px'},
                            xAxis: {type: 'category', data: dates, name: '日', axisLabel: {fontSize: 11}},
                            yAxis: {type: 'value', name: 'Tokens', axisLabel: {fontSize: 11}, splitNumber: 1},
                            series: [
                                {
                                    name: '输入(命中缓存)',
                                    type: 'bar',
                                    stack: 'total',
                                    data: cacheHitTokensData,
                                    itemStyle: {color: '#a0dcfd'}
                                },
                                {
                                    name: '输入(未命中缓存)',
                                    type: 'bar',
                                    stack: 'total',
                                    data: inputTokensData.map((v, i) => v - (cacheHitTokensData[i] || 0)),
                                    itemStyle: {color: '#60b3fe'}
                                },
                                {
                                    name: '输出',
                                    type: 'bar',
                                    stack: 'total',
                                    data: outputTokensData,
                                    itemStyle: {color: '#0c70f3'}
                                }
                            ]
                        },
                        true
                    );
                }

                // 柱状图 - 日 CodeBuddy 积分
                const creditEl2 = document.getElementById('creditChart');
                if (creditEl2) {
                    if (!creditChartInstance) {
                        creditChartInstance = echarts.init(creditEl2);
                    }
                    creditChartInstance.setOption(
                        {
                            title: {text: '日 CodeBuddy 积分', left: 'left', textStyle: {fontSize: 14, color: '#374151'}},
                            tooltip: {
                                trigger: 'axis',
                                formatter: function (params) {
                                    const p = params[0];
                                    const day = String(p.dataIndex + 1).padStart(2, '0');
                                    return `<b>${monthKey}-${day}</b><br/>CodeBuddy 积分 ${p.value.toFixed(2)}`;
                                }
                            },
                            grid: {left: '80px', right: '30px', top: '70px', bottom: '30px'},
                            xAxis: {type: 'category', data: dates, name: '日', axisLabel: {fontSize: 11}},
                            yAxis: {type: 'value', name: 'CodeBuddy 积分', axisLabel: {fontSize: 11}, splitNumber: 3},
                            series: [
                                {
                                    type: 'bar',
                                    data: creditData,
                                    itemStyle: {
                                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                            {offset: 0, color: '#f59e0b'},
                                            {offset: 1, color: '#f97316'}
                                        ])
                                    }
                                }
                            ]
                        },
                        true
                    );
                }
            }

            async function resetCustomStats() {
                if (!confirm('确定要重置自定义统计数据吗？此操作不可撤销。')) return;
                try {
                    const response = await fetch(`/codebuddyFE/stats/custom-reset`, {
                        method: 'POST'
                    });
                    if (response.ok) {
                        showToast('自定义统计数据已重置');
                        refreshApiStats();
                    } else {
                        throw new Error('重置失败');
                    }
                } catch (error) {
                    showToast('重置失败: ' + error.message, 'error');
                }
            }

            async function reloadAndRefreshStats() {
                try {
                    await fetch(`/codebuddyFE/stats/refresh`, {method: 'POST'});
                    await Promise.all([refreshApiStats(), loadDailyChartData()]);
                    showToast('数据已刷新');
                } catch (error) {
                    showToast('刷新失败: ' + error.message, 'error');
                }
            }

            async function refreshApiStats() {
                try {
                    const response = await fetch('/codebuddyFE/status');
                    const data = await response.json();
                    const cCallEl = document.getElementById('customApiCallCount');
                    if (cCallEl) {
                        cCallEl.textContent = formatStat(data.usage?.custom_api_call_count || 0);
                        cCallEl.title = new Intl.NumberFormat('zh-CN').format(data.usage?.custom_api_call_count || 0);
                    }
                    const cInEl = document.getElementById('customInputTokensCount');
                    if (cInEl) {
                        cInEl.textContent = formatStat(data.usage?.custom_input_tokens || 0);
                        cInEl.title = new Intl.NumberFormat('zh-CN').format(data.usage?.custom_input_tokens || 0);
                    }
                    const cOutEl = document.getElementById('customOutputTokensCount');
                    if (cOutEl) {
                        cOutEl.textContent = formatStat(data.usage?.custom_output_tokens || 0);
                        cOutEl.title = new Intl.NumberFormat('zh-CN').format(data.usage?.custom_output_tokens || 0);
                    }
                    const cCacheHitEl = document.getElementById('customCacheHitTokensCount');
                    if (cCacheHitEl) {
                        cCacheHitEl.textContent = formatStat(data.usage?.custom_cache_hit_tokens || 0);
                        cCacheHitEl.title = new Intl.NumberFormat('zh-CN').format(data.usage?.custom_cache_hit_tokens || 0);
                    }
                    const cCacheRateEl = document.getElementById('customCacheHitRate');
                    if (cCacheRateEl) {
                        const cacheRate =
                            (data.usage?.custom_input_tokens || 0) > 0
                                ? Math.min(100, Math.round(((data.usage?.custom_cache_hit_tokens || 0) / data.usage.custom_input_tokens) * 100))
                                : 0;
                        cCacheRateEl.textContent = cacheRate + '%';
                        cCacheRateEl.title = cacheRate + '%';
                    }
                    const cCreditEl = document.getElementById('customCreditCount');
                    if (cCreditEl) {
                        cCreditEl.textContent = (data.usage?.custom_credit || 0).toFixed(2);
                        cCreditEl.title = (data.usage?.custom_credit || 0).toFixed(2);
                    }
                } catch {}
            }

                refreshApiStats();

            async function startAuth() {
                const btn = document.getElementById('startAuthBtn');
                const container = document.getElementById('authLinkContainer');
                const link = document.getElementById('authLink');
                const box = document.getElementById('authBox');

                btn.disabled = true;
                btn.innerHTML = '<span class="loading"></span> 启动中...';

                try {
                    const baseUrl = document.getElementById('baseUrlSelect').value;
                    const response = await fetch(
                        `/codebuddyFE/auth/start?base_url=${encodeURIComponent(baseUrl)}`
                    );
                    const data = await response.json();
                    if (data.success) {
                        currentAuthState = data.auth_state;
                        box.classList.add('active');
                        container.style.display = 'block';
                        link.href = data.verification_uri_complete;
                        link.textContent = data.verification_uri_complete;
                        window.open(data.verification_uri_complete, '_blank');
                        startPolling();
                    } else {
                        throw new Error(data.message || '启动失败');
                    }
                } catch (error) {
                    let errorMsg = '启动认证失败: ' + error.message;
                    if (
                        error.message.includes('certificate') ||
                        error.message.includes('TLS') ||
                        error.message.includes('SSL')
                    ) {
                        errorMsg += '\\n\\n解决方案：设置环境变量 NODE_TLS_REJECT_UNAUTHORIZED=0 后重启服务';
                    }
                    showToast(errorMsg, 'error');
                    btn.disabled = false;
                    btn.textContent = '开始认证';
                }
            }

            function startPolling() {
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(async () => {
                    try {
                        const response = await fetch('/codebuddyFE/auth/poll', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({auth_state: currentAuthState})
                        });
                        const data = await response.json();
                        if (data.status === 'success') {
                            clearInterval(pollInterval);
                            showToast('认证成功！');
                            resetAuthUI();
                            loadCredentials();
                        } else if (data.status === 'error') {
                            clearInterval(pollInterval);
                            showToast(data.message, 'error');
                            resetAuthUI();
                        }
                    } catch (error) {
                        console.error('轮询失败:', error);
                    }
                }, 5000);
            }

            function resetAuthUI() {
                const btn = document.getElementById('startAuthBtn');
                const container = document.getElementById('authLinkContainer');
                const box = document.getElementById('authBox');
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '开始认证';
                }
                if (container) container.style.display = 'none';
                if (box) box.classList.remove('active');
                currentAuthState = null;
            }

                    const badge = document.getElementById('credCountBadge');

                        badge.textContent = credCount;
                        badge.className = 'cred-count-badge' + (credCount === 0 ? ' zero' : '');
                    }
                    if (!data.credentials || data.credentials.length === 0) {
                        list.innerHTML = '<div class="empty-state"><p>暂无凭证，请先添加</p></div>';
                        return;
                    }
                    list.innerHTML =
                        '<ul class="credential-list">' +
                        data.credentials
                            .map((cred) => {
                                const shortUrl = cred.baseUrl ? new URL(cred.baseUrl).host : 'unknown';
                                const statusParts = [];
                                const reasonLabel = {
                                    'balance': '余额不足',
                                    'soft': '限流',
                                    'breaker': '熔断',
                                    'not_found': '上游404'

                                if (cred.isDomainBlocked) {
                                    statusParts.push('域名已废弃');
                                } else {
                                    if (cred.isDisabled) statusParts.push('已禁用');
                                    else if (cred.isExpired) statusParts.push('已过期');
                                    else if (cred.isRateLimited)
                                        statusParts.push(
                                            '冷却中[' +
                                                (reasonLabel[cred.rateLimitReason] || '限流') +
                                                ']（' +
                                                cred.rateLimitRemainingStr +
                                                ' 后恢复）'
                                        );
                                    else statusParts.push('有效');
                                    statusParts.push('剩余: ' + cred.timeRemainingStr);
                                    // 窗口内连续失败计数（未达阈值；达阈值则已转入账号级冷却）
                                    if (!cred.isRateLimited && cred.failureStreak > 0) {
                                        statusParts.push(
                                            '窗口内失败 ' + cred.failureStreak + '/' + (cred.breakerThreshold || 3)
                                        );
                                    }
                                }
                                statusParts.push('上游: ' + shortUrl);
                                // 「活跃」= 下一个请求实际会用的号。
                                // 优先级模式下就是队首（priorityRank 0）且当前可用；
                                // 没排过序时退回手动选择/轮转视角。
                                const isTop = cred.priorityRank === 0;
                                const isActive =
                                    !cred.isDomainBlocked &&
                                    !cred.isDisabled &&
                                    !cred.isExpired &&
                                    !cred.isRateLimited &&
                                    (cred.isOnlyRoutable ||
                                        (cred.priorityRank >= 0
                                            ? isTop
                                            : cred.index === manualSelectedIndex));
                                let itemClass = cred.isDomainBlocked
                                    ? 'domain-blocked'
                                    : cred.isDisabled
                                      ? 'disabled'
                                      : cred.isExpired
                                        ? 'expired'
                                        : cred.isRateLimited
                                          ? 'rate-limited'
                                          : '';
                                if (isActive) itemClass = 'active-credential';
                                const toggleBtn =
                                    cred.isDomainBlocked || cred.isDisabled
                                        ? ''
                                        : '<button class="btn btn-warning btn-small" onclick="toggleCredentialDisable(' +
                                          cred.index +
                                          ')">禁用</button>';
                                // 「置顶」= 把这一行挪到优先级队列第一位，与拖动排序同一个机制。
                                // 不再用只影响单个号的 manualSelectedIndex：那套会顺带清空全池冷却，
                                // 语义又和拖动排序重复，用户根本分不清两者差别。
                                const topBtn =
                                    !cred.isDomainBlocked && !cred.isDisabled && cred.priorityRank !== 0
                                        ? '<button class="btn btn-primary btn-small" onclick="moveCredentialToTop(' +
                                          cred.index +
                                          ')">置顶</button>'
                                        : '';
                                // 重置状态：清冷却 + 解除禁用（合并为一个按钮）
                                const resetBtn =
                                    !cred.isDomainBlocked && (cred.isRateLimited || cred.isDisabled)
                                        ? '<button class="btn btn-secondary btn-small" onclick="resetCredentialRateLimit(' +
                                          cred.index +
                                          ')">重置状态</button>'
                                        : '';
                                // 测试模型：逐个模型发一次最小请求，只读探测，不影响调度
                                //
                                // 只传下标，不传账号名：账号名来自上游，可能含引号，
                                // 塞进 onclick 的字符串字面量里很容易把属性截断
                                // （之前用 JSON.stringify 就踩了这个坑：它产出双引号，
                                // 和 onclick="..." 的双引号冲突，按钮能渲染但点了没反应）。
                                // 名字由后端在 start 事件里回传，面板再显示。
                                const testBtn =
                                    !cred.isDomainBlocked && !cred.isExpired
                                        ? '<button class="btn btn-secondary btn-small" onclick="openModelTest(' +
                                          cred.index +
                                          ')" title="对这个账号逐个测试模型可用性">测试模型</button>'
                                        : '';
                                const activeTag =
                                    isActive && !cred.isDomainBlocked
                                        ? '<span style="background:#10b981;color:white;font-size:0.7rem;padding:2px 8px;border-radius:10px;margin-left:8px;">活跃</span>'
                                        : '';
                                const rateLimitTag = cred.isRateLimited
                                    ? '<span class="badge-ratelimit">' +
                                      (reasonLabel[cred.rateLimitReason] || '限流') +
                                      ' 冷却 ' +
                                      cred.rateLimitRemainingStr +
                                      '</span>'
                                    : '';
                                // 模型级锁（账号仍可用，仅这些模型被上游用量超限锁定）
                                const modelLockTag =
                                    Array.isArray(cred.modelCooldowns) && cred.modelCooldowns.length
                                        ? cred.modelCooldowns
                                              .map(
                                                  (c) =>
                                                      '<span class="badge-modellock" title="该模型上游用量超限，账号整体仍可用">' +
                                                      c.model +
                                                      ' 锁 ' +
                                                      c.remainingStr +
                                                      '</span>'
                                              )
                                              .join('')
                                        : '';
                                return `
                        <li class="credential-item ${itemClass}"
                            data-filename="${(cred.filename || '').replace(/"/g, '&quot;')}"
                            data-index="${cred.index}">
                            <div style="display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0;">
                                <span class="drag-handle" draggable="true" title="按住拖动调整优先级">⠿</span>

                                    <h4>${cred.priorityRank >= 0 ? '<span class="priority-rank' + (cred.priorityRank === 0 ? ' top' : '') + '">' + (cred.priorityRank + 1) + '</span>' : ''}${cred.email || cred.userId}${activeTag}${rateLimitTag}${modelLockTag}</h4>
                                    <p>${statusParts.join(' | ')}</p>
                                </div>
                            </div>
                            <div style="display: flex; gap: 6px;">
                                ${testBtn}
                                ${topBtn}
                                ${resetBtn}
                                ${toggleBtn}
                                <button class="btn btn-danger btn-small" onclick="deleteCredential(${cred.index})">删除</button>
                            </div>
                        </li>
                    `;
                            })
                            .join('') +
                        '</ul>';

                    bindCredentialDragSort(list);
                } catch (error) {
                    showToast('加载凭证失败: ' + error.message, 'error');
                }
            }

            /**
             * 拖动排序（原生 HTML5 DnD，事件委托挂在列表容器上）
             *
             * 只有 ⠿ 手柄带 draggable：行本身不能拖，否则选中文字、点按钮都会误触发。
             * dragstart 的 target 就是被标 draggable 的元素，也就是手柄本身，
             * 所以手柄直接找父级 li，不需要再判断 target 是不是手柄。
             *
             * 排序结果按文件名提交，不按下标：下标会随增删平移，用户排好的顺序会整片错位。
             * 提交成功后本地立刻按新顺序重排 DOM，不等下一次轮询，避免"松手后跳回去"。
             */
            let dragFilename = null;

            function bindCredentialDragSort(container) {
                const listEl = container.querySelector('.credential-list');
                if (!listEl) return;

                const clearMarks = () => {
                    listEl
                        .querySelectorAll('.drop-above, .drop-below')
                        .forEach((el) => el.classList.remove('drop-above', 'drop-below'));
                };

                listEl.addEventListener('dragstart', (ev) => {
                    const item = ev.target.closest('.credential-item');
                    if (!item) {
                        ev.preventDefault();
                        return;
                    }
                    dragFilename = item.dataset.filename;
                    item.classList.add('dragging');
                    ev.dataTransfer.effectAllowed = 'move';
                    // Firefox 要求必须 setData 才会真正开始拖动
                    ev.dataTransfer.setData('text/plain', dragFilename);
                });

                listEl.addEventListener('dragover', (ev) => {
                    if (!dragFilename) return;
                    ev.preventDefault();
                    ev.dataTransfer.dropEffect = 'move';
                    const item = ev.target.closest('.credential-item');
                    clearMarks();
                    if (!item || item.dataset.filename === dragFilename) return;
                    // 落到目标行的上半还是下半，决定插到它前面还是后面
                    const rect = item.getBoundingClientRect();
                    item.classList.add(ev.clientY < rect.top + rect.height / 2 ? 'drop-above' : 'drop-below');
                });

                listEl.addEventListener('drop', (ev) => {
                    if (!dragFilename) return;
                    ev.preventDefault();
                    const target = ev.target.closest('.credential-item');
                    if (!target || target.dataset.filename === dragFilename) {
                        clearMarks();
                        return;
                    }
                    const rect = target.getBoundingClientRect();
                    const insertBefore = ev.clientY < rect.top + rect.height / 2;

                    // 先算出新顺序再改 DOM：以当前渲染顺序为基准，把拖动项摘出来插到目标位置
                    const keys = Array.from(listEl.children).map((el) => el.dataset.filename);
                    const from = keys.indexOf(dragFilename);
                    if (from < 0) {
                        clearMarks();
                        return;
                    }
                    keys.splice(from, 1);
                    let to = keys.indexOf(target.dataset.filename);
                    if (to < 0) to = keys.length;
                    keys.splice(insertBefore ? to : to + 1, 0, dragFilename);

                    // 本地先重排，让松手瞬间顺序就定下来
                    const byKey = new Map(
                        Array.from(listEl.children).map((el) => [el.dataset.filename, el])
                    );
                    keys.forEach((k) => byKey.get(k) && listEl.appendChild(byKey.get(k)));
                    clearMarks();

                    savePriorityOrder(keys);
                });

                listEl.addEventListener('dragend', () => {
                    dragFilename = null;
                    clearMarks();
                    listEl.querySelectorAll('.dragging').forEach((el) => el.classList.remove('dragging'));
                });
            }

            async function savePriorityOrder(order) {
                try {
                    const response = await fetch(API_BASE + '/credentials/reorder', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},

                    });
                    const data = await response.json();
                    if (response.ok) {
                        showToast(data.message || '优先级已保存');
                        // 重新拉一次拿到 priorityRank，序号徽章才会跟着变
                        loadCredentials();
                    } else {
                        showToast(data.error || '保存失败', 'error');
                        loadCredentials();
                    }
                } catch (error) {
                    showToast('保存失败: ' + error.message, 'error');
                    loadCredentials();
