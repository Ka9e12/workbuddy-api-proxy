            /**
             * 额度进度条：按「已消耗 / 总额度」画利用率。
             *
             * 画已用而不是剩余，是为了和上游账单口径一致：总量、已用、剩余三个数
             * 天然闭环（总量 = 已用 + 剩余），条子走到底就是"额度花完了"。
             * 容量未知（null）时不画条，避免把"没查到"画成"用光了"。
             */
            function quotaBarHtml(used, capacity) {
                if (used == null || capacity == null || capacity <= 0) {
                    return '<span style="color:#9ca3af;font-size:0.75rem;">额度待查询</span>';
                }
                const ratio = Math.max(0, Math.min(1, used / capacity));
                const pct = (ratio * 100).toFixed(1);
                const color = ratio >= 0.9 ? '#ef4444' : ratio >= 0.7 ? '#f59e0b' : '#10b981';
                return (
                    '<div class="quota-bar">' +
                    '<div class="quota-track"><div class="quota-fill" style="width:' +
                    pct +
                    '%;background:' +
                    color +
                    ';"></div></div>' +
                    '<span class="quota-pct">已用 ' + pct + '%</span>' +
                    '</div>'
                );
            }

            /**
             * 到期倒计时徽章。这是额度里最该看的信息：积分不用会作废。
             * 3 天内标红，7 天内标黄，一年以上视为长期有效。
             */
            function expiryBadgeHtml(expiry) {
                if (!expiry || expiry.daysLeft == null) return '';
                const d = Number(expiry.daysLeft);
                let cls = 'badge-expiry';
                let text;
                if (d <= 3) {
                    cls += ' urgent';
                    text = '剩 ' + d.toFixed(1) + ' 天（即将作废）';
                } else if (d <= 7) {
                    cls += ' warn';
                    text = '剩 ' + Math.ceil(d) + ' 天';
                } else if (d < 365) {
                    text = '剩 ' + Math.floor(d) + ' 天';
                } else {
                    return '<span class="badge-expiry">长期有效</span>';
                }
                const title = '最近到期：' + (expiry.name || '') + '（剩余 ' +
                    Number(expiry.remain || 0).toLocaleString('zh-CN', {maximumFractionDigits: 2}) + '）';
                return '<span class="' + cls + '" title="' + title + '">' + text + '</span>';
            }

            /**
             * 一张指标卡：数字 + 名称 + 一句人话解释
             *
             * 只写「总额度容量」这种词没人看得懂。三个数字是一笔账：
             * 一共领到多少、花掉多少、还剩多少，每张卡下面都把这句账写明。
             */
            function metricCard(label, value, color, hint) {
                return (
                    '<div class="metric-card">' +
                    '<div class="metric-value"' + (color ? ' style="color:' + color + ';"' : '') + '>' + value + '</div>' +
                    '<div class="metric-label">' + label + '</div>' +
                    (hint ? '<div class="metric-hint">' + hint + '</div>' : '') +
                    '</div>'
                );
            }

            function renderBilling(accounts) {
                const list = document.getElementById('billingList');
                if (!accounts || accounts.length === 0) {
                    list.innerHTML = '<div class="empty-state"><p>暂无国内站凭证</p></div>';
                    return;
                }

                // 按站点分组统计。
                //
                // 国内站和国际站的积分是两套独立的账：国内积分跑不了国际站的模型，
                // 反过来也一样。把两边相加得到的数字没有对应的现实含义——它不是
                // "还能花多少"，也不是"这个月领了多少"，只是一个无意义的和。
                // 所以每个站点各自一套指标，不跨站合计。
                const REALMS = [
                    {key: 'cn', label: '国内站', host: 'copilot.tencent.com'},
                    {key: 'intl', label: '国际站', host: 'www.codebuddy.ai'}
                ];
                const known = accounts.filter((a) => a.remaining != null && a.capacity != null);
                const missing = accounts.length - known.length;
                const fmt = (n) => Number(n).toLocaleString('zh-CN', {maximumFractionDigits: 2});

                /** 某一站点的总览块；该站点没有账号时返回空串 */
                const realmOverview = (realm) => {
                    const group = known.filter((a) => (a.realm || 'cn') === realm.key);
                    if (group.length === 0) return '';
                    const sum = (key) => group.reduce((s, a) => s + Number(a[key] || 0), 0);
                    const totalRemaining = sum('remaining');
                    const totalCapacity = sum('capacity');
                    const totalUsed = sum('used');

                    let soonest = null;
                    for (const a of group) {
                        if (a.soonestExpiry && (!soonest || a.soonestExpiry.at < soonest.at)) {
                            soonest = a.soonestExpiry;
                        }
                    }

                    return (
                        '<div class="quota-overview">' +
                        '<div class="realm-head">' +
                        '<strong>' + realm.label + '</strong>' +
                        '<span>' + realm.host + ' · ' + group.length + ' 个账号</span>' +
                        '</div>' +
                        '<div class="metric-grid">' +
                        metricCard('本月剩余可用积分', fmt(totalRemaining), '#10b981', '这个站现在能花的部分') +
                        metricCard('本月已花费', fmt(totalUsed), '#6b7280', '本月领取的积分里用掉的') +
                        metricCard('本月累计领取总额度', fmt(totalCapacity), '#1f2937', '本月所有积分包的面额之和') +
                        metricCard(
                            '最近一次作废',
                            soonest ? Math.floor(soonest.daysLeft) + ' 天后' : '—',
                            '#f59e0b',
                            soonest ? '届时未用完的会清零' : '没有即将到期的包'
                        ) +
                        '</div>' +
                        quotaBarHtml(totalUsed, totalCapacity) +
                        '<div style="font-size:0.75rem;color:#6b7280;margin-top:8px;">' +
                        (soonest
                            ? '最早的一批 ' + expiryBadgeHtml(soonest) + ' 到期，那一包里还有 ' + fmt(soonest.remain) + ' 分'
                            : '当前没有即将到期的包') +
                        '</div>' +
                        '</div>'
                    );
                };

                const overview =
                    known.length === 0
                        ? ''
                        : REALMS.map(realmOverview).join('') +
                          (missing > 0
                              ? '<div style="font-size:0.75rem;color:#6b7280;margin-bottom:10px;">另有 ' +
                                missing + ' 个账号查询失败，未计入</div>'
                              : '');

                list.innerHTML =
                    overview +
                    '<ul class="credential-list">' +
                    // 按站点排序，同站账号挨在一起，跟上面的分组总览对得上
                    accounts
                        .slice()
                        .sort((a, b) => String(a.realm || 'cn').localeCompare(String(b.realm || 'cn')))
                        .map((a) => {
                            const remaining = a.remaining === null || a.remaining === undefined
                                ? '<span style="color:#9ca3af;">待查询</span>'
                                : '<strong>' + Number(a.remaining).toLocaleString('zh-CN', {maximumFractionDigits: 2}) + '</strong>';
                            const staleTag = a.stale ? ' <span style="color:#f59e0b;font-size:0.7rem;">(待刷新)</span>' : '';
                            // 签到只有国内个人站有；国际站显示站点标签代替签到按钮
                            const checkinTag = !a.supportsCheckin
                                ? '<span class="badge-realm">国际站</span>'
                                : a.checkedToday
                                  ? '<span style="background:#10b981;color:white;font-size:0.7rem;padding:2px 8px;border-radius:10px;">已签到</span>'
                                  : '<button class="btn btn-secondary btn-small" onclick="singleCheckin(\'' + (a.userId || '').replace(/'/g, "\\'") + '\')">签到</button>';
                            const errorLine = a.error ? '<p style="color:#ef4444;font-size:0.8rem;">' + a.error + '</p>' : '';
                            // 三个数字统一用「本月」口径，和上方指标卡一致
                            const numbers =
                                a.capacity == null
                                    ? '本月还剩 ' + remaining + ' 积分'
                                    : '本月还剩 ' + remaining +
                                      ' 积分  ·  已花 ' + Number(a.used || 0).toLocaleString('zh-CN', {maximumFractionDigits: 2}) +
                                      ' 积分  ·  本月累计领取 ' + Number(a.capacity).toLocaleString('zh-CN', {maximumFractionDigits: 2}) +
                                      ' 积分';
                            // 成长中心数据按 userId 对上：只有国内个人站才有，
                            // 国际站/企业站查不到就自然不显示这一行
                            const growth = growthCache.find((g) => g && g.supported !== false && g.userId === a.userId);
                            const growthHtml = growth && !growth.error ? travelLine(growth) : '';
                            return `
                        <li class="credential-item">
                            <div class="credential-info">
                                <h4>${a.email || a.userId} ${checkinTag}${expiryBadgeHtml(a.soonestExpiry)}</h4>
                                <p>${numbers}${staleTag}</p>
                                ${quotaBarHtml(a.used, a.capacity)}
                                ${growthHtml}
                                ${errorLine}
                            </div>
                        </li>
                    `;
                        })
                        .join('') +
                    '</ul>';
            }

            async function singleCheckin(userId) {
                try {
                    const response = await fetch('/codebuddyFE/billing/checkin', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({userId})
                    });
                    const data = await response.json();
                    if (response.ok) {
                        showToast(data.message || '签到完成');
                    } else {
                        showToast(data.error || '签到失败', 'error');
                    }
                    refreshBilling();
                } catch (error) {
                    showToast('签到失败: ' + error.message, 'error');
                }
            }

            async function batchCheckin(btn) {
                if (btn) btn.disabled = true;
                try {
                    const response = await fetch('/codebuddyFE/billing/status');
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || '查询失败');
                    // 国际站没有签到活动，别把它算进"待签到"
                    const unchecked = (data.accounts || []).filter(
                        (a) => a.supportsCheckin && !a.checkedToday && !a.error
                    );
                    if (unchecked.length === 0) {
                        showToast('所有账号今日均已签到');
                        return;
                    }
                    for (const a of unchecked) {
                        await singleCheckin(a.userId);
                    }
                } catch (error) {
                    showToast('批量签到失败: ' + error.message, 'error');
                } finally {
                    if (btn) btn.disabled = false;
                }
            }

            // ========== 成长中心：只保留猫猫旅行 ==========
            // 已去掉的三块，都是「永远显示同一个值」的装饰，占着位置反而让人以为坏了：
            // - 连登天数：按官方客户端的对话活跃累计，代理不代报活跃，天数永远不动
            // - 抽奖次数：要先兑换档位才有，实际一直是 0
            // - 成长任务：5 个任务由上游按账号行为判定，没有逐项状态、没有提交端点
            //   （实测 tasks/claim 等均 404），代理侧无法触发任何一项
            async function refreshGrowth() {
                try {
                    const response = await fetch('/codebuddyFE/growth/status');
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || '查询失败');
                    growthCache = data.accounts || [];
                } catch {
                    // 成长数据是附加信息，拿不到就不显示，不影响积分板块
                    growthCache = [];
                }
            }

            /**
             * 猫猫旅行一行：状态 + 今日名额 + 「执行一次」
             *
             * 按钮挂在这一行而不是账号条目右侧：「执行一次」动的就是猫猫旅行
             * （领礼物 / 派出门），外加连登档位兑换和抽奖。
             */
            function travelLine(a) {
                const t = a.travel || {};
                const map = {idle: '在家', traveling: '旅行中', arrived: '已到站待领取', unknown: '未知'};
                const state = map[t.state] || t.state || '未知';
                let hint = '派它出去旅行，几小时后带回礼物';
                if (t.state === 'arrived') hint = '礼物已带回，点「执行一次」领取';
                else if (t.state === 'traveling') hint = '正在旅行，到站后带回礼物需手动领取';
                else if (t.dailyLimitReached) hint = '今日派出名额已用完，明天再来';

                const color =
                    t.state === 'arrived' ? '#f59e0b' : t.state === 'traveling' ? '#3b82f6' : t.dailyLimitReached ? '#9ca3af' : '#10b981';
                const tag = '<span style="display:inline-block;font-size:0.7rem;padding:1px 7px;border-radius:9px;background:' +
                    color + ';color:#fff;margin-left:6px;">' + state + '</span>';

                return '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:0.8rem;color:#6b7280;margin-top:6px;">' +
                    '<span>猫猫旅行' + tag + '</span>' +
                    '<span style="color:#9ca3af;">' + escapeHtml(hint) + '</span>' +
                    '<button class="btn btn-secondary btn-small" style="padding:1px 8px;font-size:0.72rem;" ' +
                    'onclick="runGrowthOne(\'' + escapeHtml(String(a.userId || '').replace(/'/g, "\\'")) + '\')">执行一次</button>' +
                    '</div>';
            }

            async function runGrowthOne(userId) {
                try {
                    const response = await fetch('/codebuddyFE/growth/run', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({userId})
                    });
                    const data = await response.json();
                    if (response.ok) {
                        const parts = [];
                        if (data.adopt && data.adopt.action !== 'skip') parts.push('领养');
                        if (data.claim && data.claim.action === 'claimed') parts.push('领奖');
                        if (data.depart && data.depart.action === 'departed') parts.push('派猫');
                        if (data.streak && data.streak.message) parts.push(data.streak.message);
                        showToast(parts.length ? '已完成: ' + parts.join('，') : '本日已无待办动作');
                        await refreshGrowth();
                        refreshBilling();
                    } else {
                        showToast(data.error || '执行失败', 'error');
                    }
                } catch (error) {
                    showToast('执行失败: ' + error.message, 'error');
                }
            }

            async function loadModels() {
                const container = document.getElementById('modelsContainer');
                container.innerHTML = '<div class="empty-state"><p>加载中... <span class="loading"></span></p></div>';
                try {
                    const response = await fetch('/codebuddyFE/models');
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || '查询失败');
                    renderModels(data);
                } catch (error) {
                    container.innerHTML = '<div class="empty-state"><p>加载失败: ' + error.message + '</p></div>';
                }
            }

            /**
             * 渲染模型列表，按站点分块。
             *
             * 国内站和国际站的模型集合与倍率都不一样，混在一张表里会让人以为
             * 同一个模型名两边价格相同。每个站点单独一块，倍率各看各的。
             */
            function renderModels(data) {
                const container = document.getElementById('modelsContainer');
                const realms = Array.isArray(data.realms) ? data.realms : null;
                // 兼容旧接口形态（没有 realms 时按单站点处理）
                const groups = realms || [{realm: 'cn', models: data.models || [], fromCache: data.fromCache === true}];

                const nonEmpty = groups.filter((g) => (g.models || []).length > 0);
                if (nonEmpty.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>暂无可用模型（请确认已添加有效凭证）</p></div>';
                    return;
                }

                const REALM_META = {
                    cn: {label: '国内站', host: 'copilot.tencent.com'},
                    intl: {label: '国际站', host: 'www.codebuddy.ai'}
                };
                // 厂商名称与顺序由后端 VENDOR_META 统一给出（见 config.js），
                // 这里不再各自维护一份，避免面板和控制台两处名字/顺序不一致。
                // 兜底：后端没给时用内置表，保证旧接口形态也能正常渲染。
                const vendorNames = Object.keys(data.vendorLabels || {}).length
                    ? data.vendorLabels
                    : {deepseek: 'DeepSeek', gpt: 'GPT', gemini: 'Gemini', hunyuan: '腾讯混元', zhipu: '智谱 GLM', moonshot: 'Kimi', minimax: 'MiniMax', others: '其他'};
                const vendorOrder = Array.isArray(data.vendorOrder) && data.vendorOrder.length
                    ? data.vendorOrder
                    : ['deepseek', 'gpt', 'gemini', 'hunyuan', 'zhipu', 'moonshot', 'minimax', 'others'];
                const fmtRate = (v) => v === null || v === undefined ? '—' : (v === 0 ? '免费' : 'x' + v);

                let html = '';
                for (const g of nonEmpty) {
                    const meta = REALM_META[g.realm] || {label: g.realm, host: ''};
                    // 站点标题直接给「可用 / 总数」：用户最关心的是能用的有几个
                    const total = g.models.length;
                    const blockedN = g.models.filter((m) => m.blocked).length;
                    const usableN = total - blockedN;
                    const countText = blockedN > 0
                        ? usableN + ' 个可用 / 共 ' + total + ' 个'
                        : total + ' 个模型';
                    html += '<div class="model-realm">';
                    html += '<div class="realm-head">' +
                        '<strong>' + meta.label + '</strong>' +
                        '<span>' + meta.host + ' · ' + countText + '</span>' +
                        '</div>';
                    if (blockedN > 0) {
                        // 只说明「没有权限」，不再让用户手动删缓存文件：
                        // 重测成功的模型会自动改回可用（探测结果直接写回权限表）。
                        html += '<div class="empty-state" style="padding:6px 12px;margin-bottom:8px;">' +
                            '<p style="color:#b45309;font-size:0.82rem;">' +
                            blockedN + ' 个模型当前账号没有权限（已灰显）。' +
                            '这是根据实测结果判断的；升级套餐后点「测试模型」重测一次，' +
                            '能用的会自动变回可用。' +
                            '</p></div>';
                    }
                    if (g.fromCache) {
                        html += '<div class="empty-state" style="padding:6px 12px;margin-bottom:8px;"><p style="color:#f59e0b;">上游拉取失败，显示该站点最近一次结果</p></div>';
                    }
                    if (g.error) {
                        html += '<div class="empty-state" style="padding:6px 12px;margin-bottom:8px;"><p style="color:#ef4444;">' + escapeHtml(g.error) + '</p></div>';
                    }

                    // 按厂商分组
                    const vendorGroups = {};
                    for (const m of g.models) {
                        (vendorGroups[m.vendor] ||= []).push(m);
                    }
                    // 每组内按倍率升序
                    for (const list of Object.values(vendorGroups)) {
                        list.sort((a, b) => (a.creditsValue ?? Infinity) - (b.creditsValue ?? Infinity));
                    }
                    for (const vendor of vendorOrder) {
                        const list = vendorGroups[vendor];
                        if (!list || list.length === 0) continue;
                        const label = vendorNames[vendor] || vendor;
                        html += '<div class="guide-step-title" style="margin-top: 12px;">' + label + '</div>';
                        html += '<div class="guide-step-desc"><table class="guide-model-table"><thead><tr><th>模型</th><th>说明</th><th>倍率</th><th>可用性</th></tr></thead><tbody>';
                        for (const m of list) {
                            // 三种状态分开显示：
                            // - 不可用（没权限 / 模型不存在）：灰显
                            // - 今日额度用完：正常显示，只在可用性列写一句，不标灰
                            //   （那只是今天用超了，明天照常，标灰会让人以为模型坏了）
                            // - 可用
                            const rowStyle = m.blocked ? ' style="opacity:0.55;"' : '';
                            let availability;
                            if (m.blocked) {
                                availability = '<span style="color:#dc2626;font-size:0.78rem;" title="' +
                                    escapeHtml(m.blockedReason || '') + '">不可用</span>';
                            } else if (m.quotaNote) {
                                availability = '<span style="color:#b45309;font-size:0.75rem;" title="' +
                                    escapeHtml(m.quotaNote) + '">今日额度用完</span>';
                            } else {
                                availability = '<span style="color:#059669;font-size:0.78rem;">可用</span>';
                            }
                            html += '<tr' + rowStyle + '>' +
                                '<td><code>' + escapeHtml(m.id) + '</code></td>' +
                                '<td>' + escapeHtml(m.name) + '</td>' +
                                '<td>' + fmtRate(m.creditsValue) + '</td>' +
                                '<td>' + availability + '</td>' +
                                '</tr>';
                        }
                        html += '</tbody></table></div>';
                    }
                    html += '</div>';
                }
                container.innerHTML = html;
            }

            async function deleteCredential(index) {
                if (!confirm('确定要删除此凭证吗？')) return;
                try {
                    const response = await fetch(`/codebuddyFE/credentials/delete`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({index})
                    });
                    if (response.ok) {
                        showToast('凭证已删除');
                        loadCredentials();
                    } else {
                        throw new Error('删除失败');
                    }
                } catch (error) {
                    showToast('删除失败: ' + error.message, 'error');
                }
            }

            async function resetCredentialRateLimit(index) {
                try {
                    const response = await fetch(`/codebuddyFE/credentials/reset-ratelimit`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({index, clearDisabled: true})
                    });
                    const data = await response.json();
                    if (response.ok) {
                        showToast(data.message);
                        loadCredentials();
                    } else {
                        throw new Error(data.error || '操作失败');
                    }
                } catch (error) {
                    showToast('重置失败: ' + error.message, 'error');
                }
            }

            async function toggleCredentialDisable(index) {
                try {
                    const response = await fetch(`/codebuddyFE/credentials/toggle-disable`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({index})
                    });
                    const data = await response.json();
                    if (response.ok) {
                        showToast(data.message);
                        loadCredentials();
                    } else {
                        throw new Error(data.error || '操作失败');
                    }
                } catch (error) {
                    showToast('操作失败: ' + error.message, 'error');
                }
            }

            /**
             * 把某个号挪到优先级队列第一位。
             *
             * 走的是和拖动排序完全相同的接口（提交完整文件名顺序），
             * 所以只有一套优先级来源，不会出现"拖了 A 却还在用 C"。
             * 也不再顺带清空全池冷却——要清冷却用「重置状态」，那是另一个意图。
             */
            async function moveCredentialToTop(index) {
                try {
                    // 以当前 DOM 顺序为准（就是后端返回的优先级顺序）
                    const listEl = document.querySelector('#credentialsList .credential-list');
                    if (!listEl) return;
                    const keys = Array.from(listEl.children).map((el) => el.dataset.filename);
                    const target = listEl.querySelector('[data-index="' + index + '"]');
                    if (!target) return;
                    const filename = target.dataset.filename;
                    const from = keys.indexOf(filename);
                    if (from <= 0) return; // 已经在第一位
                    keys.splice(from, 1);
                    keys.unshift(filename);

                    const response = await fetch(API_BASE + '/credentials/reorder', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({order: keys})
                    });
                    const data = await response.json();
                    if (response.ok) {
                        showToast('已置顶，下一个请求起优先用它');
                        loadCredentials();
                    } else {
                        showToast(data.error || '操作失败', 'error');
                    }
                } catch (error) {
                    showToast('操作失败: ' + error.message, 'error');
                }
            }

            /**
             * 把动态文本转义后再拼进 innerHTML。
             * label 是用户输入，email/userId/baseUrl 来自上游，不转义就是存储型 XSS。
             */
            function escapeHtml(value) {
                return String(value === null || value === undefined ? '' : value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            /**
             * 加载并渲染 Key 列表
             * 每条 Key 的账号作用域：unrestricted=true 表示不限（显示「全部账号」）
             */
            async function loadApiKeys() {
                const container = document.getElementById('apiKeysList');
                if (!container) return;
                try {
                    const response = await fetch(API_BASE + '/api-keys');
                    const data = await response.json();
                    apiKeys = Array.isArray(data.keys) ? data.keys : [];
                    totalCredentials = data.totalCredentials || 0;
                    renderApiKeys();
                } catch (error) {
                    container.innerHTML = '<div class="empty-state"><p>加载 Key 列表失败：' + escapeHtml(error.message) + '</p></div>';
                }
            }

            function renderApiKeys() {
                const container = document.getElementById('apiKeysList');
                if (!container) return;
                if (!apiKeys.length) {
                    container.innerHTML = '<div class="empty-state"><p>还没有 API Key</p></div>';
                    return;
                }
                container.innerHTML = apiKeys
                    .map((key, idx) => {
                        const revealed = apiKeyRevealed.has(key.id);
                        const shown = revealed ? key.plain || key.prefix : key.prefix;
                        // 第一条是默认 Key：Copilot / Relay 面板展示与使用指南都用它
                        const defaultTag =
                            idx === 0
                                ? '<span style="background:#667eea;color:#fff;font-size:0.68rem;padding:2px 8px;border-radius:10px;margin-left:6px;">默认</span>'
                                : '';
                        const scopeText = key.unrestricted
                            ? '<span style="color:#059669;">全部账号</span>'
                            : '<span style="color:#b45309;">限 ' + key.allowedCount + ' / ' + totalCredentials + ' 个账号</span>';
                        const missingTag =
                            Array.isArray(key.allowedMissing) && key.allowedMissing.length
                                ? '<span style="color:#dc2626;font-size:0.76rem;margin-left:8px;">' +
                                  key.allowedMissing.length +
                                  ' 个已删除的账号仍在白名单里，建议重新勾选</span>'
                                : '';
                        return `
                        <div class="api-key-row" data-key-id="${escapeHtml(key.id)}" style="border:1px solid #e5e7eb;border-radius:8px;padding:12px 14px;margin-bottom:10px;">
                            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                                <strong style="font-size:0.95rem;">${escapeHtml(key.label)}</strong>${defaultTag}
                                <span style="font-size:0.78rem;color:#6b7280;">${scopeText}</span>${missingTag}
                            </div>
                            <div style="display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;">
                                <code style="flex:1;min-width:220px;background:#f1f5f9;border-radius:6px;padding:6px 10px;word-break:break-all;font-size:0.82rem;">${escapeHtml(shown)}</code>
                                <div style="display:flex;gap:6px;flex-shrink:0;">
                                    <button class="btn-icon" onclick="toggleKeyVisibility('${escapeHtml(key.id)}')" title="显示/隐藏">${revealed ? '🙈' : '👁'}</button>
                                    <button class="btn-icon" onclick="copyKeyById('${escapeHtml(key.id)}')" title="复制">📋</button>
                                    <button class="btn btn-secondary btn-small" onclick="renameApiKey('${escapeHtml(key.id)}')">改名</button>
                                    <button class="btn btn-primary btn-small" onclick="openKeyScopeEditor('${escapeHtml(key.id)}')">账号权限</button>
                                    <button class="btn btn-warning btn-small" onclick="resetApiKey('${escapeHtml(key.id)}')">重置</button>
                                    <button class="btn btn-danger btn-small" onclick="deleteApiKey('${escapeHtml(key.id)}')">删除</button>
                                </div>
                            </div>
                        </div>`;
                    })
                    .join('');
                // 指南里的 token 跟着第一条走，改名/重置后同步
                if (apiKeys[0]) {
                    apiKeyPlain = apiKeys[0].plain || '';
                    apiKeyMasked = apiKeys[0].prefix || '****';
                }
                updateGuideConfig();
            }

            function findApiKey(id) {
                return apiKeys.find((k) => k.id === id) || null;
            }

            function toggleKeyVisibility(id) {
                if (apiKeyRevealed.has(id)) apiKeyRevealed.delete(id);
                else apiKeyRevealed.add(id);
                renderApiKeys();
            }

            async function copyKeyById(id) {
                const key = findApiKey(id);
                const text = key ? key.plain || key.prefix : '';
                if (!text) {
                    showToast('无可复制的 API Key', 'error');
                    return;
                }
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text);
                    } else {
                        const textarea = document.createElement('textarea');
                        textarea.value = text;
                        textarea.style.cssText = 'position:fixed;left:-9999px;opacity:0';
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                    }
                    showToast('API Key 已复制');
                } catch (error) {
                    showToast('复制失败: ' + error.message, 'error');
                }
            }

            async function createApiKey() {
                const label = (prompt('给这个 Key 起个名字（比如「Claude Code 本机」）', 'Key ' + (apiKeys.length + 1)) || '').trim();
                if (label === '') {
                    // prompt 被取消返回 null；用户主动清空也当作取消
                    return;
                }
                try {
                    const response = await fetch(API_BASE + '/api-keys', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({label})
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || '新建失败');
                    apiKeyRevealed.add(data.key.id);
                    await loadApiKeys();
                    showToast('已新建，明文已展开，复制后妥善保存');
                } catch (error) {
                    showToast('新建失败: ' + error.message, 'error');
                }
            }

            async function renameApiKey(id) {
                const key = findApiKey(id);
                const next = prompt('新的名称', key ? key.label : '');
                if (next === null || !next.trim()) return;
                await patchApiKey(id, {label: next.trim()}, '已改名');
            }

            async function deleteApiKey(id) {
                const key = findApiKey(id);
                if (!confirm('删除「' + (key ? key.label : id) + '」？用它接入的客户端会立刻失效。')) return;
                try {
                    const response = await fetch(API_BASE + '/api-keys/delete', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({id})
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || '删除失败');
                    apiKeyRevealed.delete(id);
                    await loadApiKeys();
                    showToast('Key 已删除');
                } catch (error) {
                    showToast('删除失败: ' + error.message, 'error');
                }
            }

            async function patchApiKey(id, patch, successMessage) {
                try {
                    const response = await fetch(API_BASE + '/api-keys/update', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({id, ...patch})
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || '保存失败');
                    await loadApiKeys();
                    if (successMessage) showToast(successMessage);
                    return true;
                } catch (error) {
                    showToast('保存失败: ' + error.message, 'error');
                    return false;
                }
            }

            /**
             * 账号权限弹窗
             *
             * 两个模式：全部账号（写 null）/ 指定账号（写文件名数组）。
             * 「指定」但一个都没勾时不允许保存 —— 那会让这个 Key 完全不可用，
             * 用户多半是误操作而不是本意。
             */
            async function openKeyScopeEditor(id) {
                const key = findApiKey(id);
                if (!key) return;
                let credentials = [];
                try {
                    const response = await fetch(API_BASE + '/credentials');
                    const data = await response.json();
                    credentials = Array.isArray(data.credentials) ? data.credentials : [];
                } catch (error) {
                    showToast('加载账号列表失败: ' + error.message, 'error');
                    return;
                }

                editingKeyId = id;
                const selected = new Set(Array.isArray(key.allowedCredentialFiles) ? key.allowedCredentialFiles : []);
                const unrestricted = key.allowedCredentialFiles === null;

                // 按上游 host 分组，用户能一眼看出「国内站 / 国际站 / 企业站」
                const groups = new Map();
                for (const cred of credentials) {
                    let host = '未知上游';
                    try {
                        host = new URL(cred.baseUrl).host;
                    } catch {
                        /* keep fallback */
                    }
                    if (!groups.has(host)) groups.set(host, []);
                    groups.get(host).push(cred);
                }

                const rows = Array.from(groups.entries())
                    .map(([host, list]) => {
                        const items = list
                            .map((cred) => {
                                const checked =
                                    !unrestricted && selected.has(cred.filename) ? 'checked' : '';
                                const disabled = unrestricted ? 'disabled' : '';
                                const tag = cred.isRoutable
                                    ? ''
                                    : '<span style="color:#b45309;font-size:0.72rem;margin-left:6px;">（' +
                                      escapeHtml(cred.unroutableReason || '不可用') +
                                      '）</span>';
                                return `<label style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:0.86rem;">
                                    <input type="checkbox" class="scope-check" value="${escapeHtml(cred.filename)}" ${checked} ${disabled}>
                                    <span>${escapeHtml(cred.email || cred.userId)}${tag}</span>
                                </label>`;
                            })
                            .join('');
                        return `<div style="margin-bottom:12px;">
                            <div style="font-size:0.78rem;color:#6b7280;margin-bottom:4px;">${escapeHtml(host)} · ${list.length} 个账号</div>
                            ${items}
                        </div>`;
                    })
                    .join('');

                const modal = document.getElementById('keyScopeModal');
                document.getElementById('keyScopeTitle').textContent = '「' + key.label + '」可使用的 CodeBuddy 账号';
                document.getElementById('keyScopeBody').innerHTML =
                    `<label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:600;">
                        <input type="radio" name="scopeMode" value="all" ${unrestricted ? 'checked' : ''} onchange="onScopeModeChange()">
                        全部账号（以后新增的账号也自动可用）
                    </label>
                    <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:600;">
                        <input type="radio" name="scopeMode" value="pick" ${unrestricted ? '' : 'checked'} onchange="onScopeModeChange()">
                        只允许勾选的账号
                    </label>
                    <div id="keyScopePicker" style="border-top:1px solid #e5e7eb;padding-top:12px;${unrestricted ? 'opacity:0.45;' : ''}">
                        ${rows || '<div style="color:#6b7280;font-size:0.85rem;">还没有任何账号</div>'}
                    </div>`;
                modal.style.display = 'flex';
            }

            function onScopeModeChange() {
                const mode = document.querySelector('input[name="scopeMode"]:checked')?.value;
                const picker = document.getElementById('keyScopePicker');
                if (!picker) return;
                const isPick = mode === 'pick';
                picker.style.opacity = isPick ? '1' : '0.45';
                picker.querySelectorAll('input.scope-check').forEach((el) => {
                    el.disabled = !isPick;
                });
            }

            async function saveKeyScope() {
                const mode = document.querySelector('input[name="scopeMode"]:checked')?.value || 'all';
                let scope = null;
                if (mode === 'pick') {
                    scope = Array.from(document.querySelectorAll('input.scope-check:checked')).map((el) => el.value);
                    if (scope.length === 0) {
                        showToast('至少勾选一个账号，否则这个 Key 会用不了', 'error');
                        return;
                    }
                }
                const ok = await patchApiKey(editingKeyId, {allowedCredentialFiles: scope}, '账号权限已保存');
                if (ok) closeKeyScopeModal();
            }

            function closeKeyScopeModal() {
                const modal = document.getElementById('keyScopeModal');
                if (modal) modal.style.display = 'none';
                editingKeyId = null;
            }

            /* ==================== 模型可用性测试 ==================== */

            /**
             * 打开测试弹窗：先让用户勾选要测哪几个模型
             *
             * 为什么不默认全测：每次探测都是一次真实的上游调用，按输入 token 计费。
             * 32 个模型全测一轮会消耗积分，用户往往只想确认手头在用的那几个。
             * 所以这里只拉模型清单（只读、不计费），勾选后才真正发请求。
             */
            function openModelTest(index) {
                if (modelTestAbort) {
                    try { modelTestAbort.abort(); } catch {}
                    modelTestAbort = null;
                }

                modelTestIndex = index;
                modelTestModels = [];

                const modal = document.getElementById('modelTestModal');
                const bodyEl = document.getElementById('modelTestBody');
                const summaryEl = document.getElementById('modelTestSummary');
                const barEl = document.getElementById('modelTestProgressBar');
                const startBtn = document.getElementById('modelTestStartBtn');
                const costHint = document.getElementById('modelTestCostHint');

                document.getElementById('modelTestTitle').textContent = '测试模型可用性';
                document.getElementById('modelTestSubtitle').textContent =
                    '账号 #' + index + ' · 勾选后才会发请求（每次探测都会消耗少量积分）';
                bodyEl.innerHTML = '<div class="empty-state"><p>正在获取模型列表... <span class="loading"></span></p></div>';
                summaryEl.textContent = '';
                costHint.textContent = '';
                barEl.style.width = '0';
                startBtn.style.display = 'none';
                startBtn.disabled = true;
                modal.style.display = 'flex';

                fetch(API_BASE + '/credentials/models?index=' + encodeURIComponent(index))
                    .then((r) => r.json().then((d) => ({ok: r.ok, data: d})))
                    .then(({ok, data}) => {
                        if (!ok) throw new Error(data.error || '获取模型列表失败');
                        modelTestModels = Array.isArray(data.models) ? data.models : [];
                        const usable = data.usableCount != null
                            ? data.usableCount
                            : modelTestModels.filter((m) => !m.blocked).length;
                        const blockedN = data.blockedCount || 0;
                        document.getElementById('modelTestSubtitle').textContent =
                            (data.email || '账号 #' + index) + ' · ' + data.baseUrl +
                            ' · ' + usable + ' 个可用' +
                            (blockedN ? ' · ' + blockedN + ' 个已知不可用（灰显）' : '');
                        renderModelPicker(data);
                        startBtn.style.display = 'inline-flex';
                    })
                    .catch((error) => {
                        bodyEl.innerHTML = '<div class="empty-state"><p style="color:#dc2626;">' +
                            escapeHtml(error.message) + '</p></div>';
                    });
            }

            /**
             * 渲染模型勾选列表
             *
             * 默认不勾任何模型：用户勾了哪个就测哪个，成本完全由他控制。
             * 但会记住上一次的勾选，重复测同一批时不用重新点。
             */
            function renderModelPicker(data) {
                const bodyEl = document.getElementById('modelTestBody');
                const vendorLabels = data.vendorLabels || {};
                const vendorOrder = Array.isArray(data.vendorOrder) && data.vendorOrder.length
                    ? data.vendorOrder
                    : ['deepseek', 'gpt', 'gemini', 'hunyuan', 'zhipu', 'moonshot', 'minimax', 'others'];
                const remembered = loadRememberedProbeModels(modelTestIndex);

                const groups = {};
                for (const m of modelTestModels) {
                    if (!groups[m.vendor]) groups[m.vendor] = [];
                    groups[m.vendor].push(m);
                }

                let html = '<div style="display:flex;gap:12px;align-items:center;margin-bottom:10px;font-size:0.84rem;">' +
                    '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;">' +
                    '<input type="checkbox" id="modelPickAll" onchange="toggleAllProbeModels(this.checked)"> 全选' +
                    '</label>' +
                    '<span id="modelPickCount" style="color:#6b7280;">已选 0 个</span>' +
                    '</div>';

                for (const vendor of vendorOrder) {
                    const list = groups[vendor];
                    if (!list || list.length === 0) continue;
                    const blockedInGroup = list.filter((m) => m.blocked).length;
                    // 厂商分组头自带勾选框：勾上等于一次性勾选本组全部模型。
                    // data-vendor 让 updateProbeSelection 能回头把分组框同步成
                    // 全选 / 半选 / 未选，避免手点单个模型后分组框状态说谎。
                    html += '<div style="margin-bottom:12px;">' +
                        '<label style="display:flex;align-items:center;gap:6px;font-size:0.78rem;color:#6b7280;margin-bottom:4px;cursor:pointer;">' +
                        '<input type="checkbox" class="vendor-pick" data-vendor="' + escapeHtml(vendor) + '"' +
                        ' onchange="toggleVendorModels(this)">' +
                        escapeHtml(vendorLabels[vendor] || vendor) + ' · ' + list.length + ' 个' +
                        (blockedInGroup ? '<span style="color:#dc2626;">（' + blockedInGroup + ' 个不可用）</span>' : '') +
                        '</label>';
                    for (const m of list) {
                        // 已知不可用的模型默认不勾：本意是测「能不能用」，
                        // 已经知道答案的没必要再花一次请求。但框保留可见，
                        // 用户想复测（比如刚升级套餐）仍然可以自己点上。
                        const checked = !m.blocked && remembered.has(m.id) ? ' checked' : '';
                        const rowStyle = m.blocked
                            ? 'display:flex;align-items:center;gap:8px;padding:3px 0;font-size:0.85rem;cursor:pointer;opacity:0.55;'
                            : 'display:flex;align-items:center;gap:8px;padding:3px 0;font-size:0.85rem;cursor:pointer;';
                        const blockedTag = m.blocked
                            ? '<span style="color:#dc2626;font-size:0.75rem;margin-left:4px;" title="' +
                              escapeHtml(m.blockedReason || '当前账号不可用') + '">不可用</span>'
                            : '';
                        html += '<label style="' + rowStyle + '">' +
                            '<input type="checkbox" class="model-pick" data-vendor="' + escapeHtml(vendor) + '"' +
                            ' data-blocked="' + (m.blocked ? '1' : '0') + '"' +
                            ' value="' + escapeHtml(m.id) + '"' + checked +
                            ' onchange="updateProbeSelection()">' +
                            '<code>' + escapeHtml(m.id) + '</code>' +
                            (m.name && m.name !== m.id
                                ? '<span style="color:#9ca3af;">' + escapeHtml(m.name) + '</span>'
                                : '') +
                            blockedTag +
                            '</label>';
                    }
                    html += '</div>';
                }

                bodyEl.innerHTML = html;
                updateProbeSelection();
            }

            function getSelectedProbeModels() {
                return Array.prototype.slice
                    .call(document.querySelectorAll('input.model-pick:checked'))
                    .map((el) => el.value);
            }

            /**
             * 厂商分组框：勾上就全选本组，取消就全不选
             */
            function toggleVendorModels(el) {
                var vendor = el.getAttribute('data-vendor');
                var boxes = document.querySelectorAll('input.model-pick[data-vendor="' + vendor + '"]');
                for (var i = 0; i < boxes.length; i++) {
                    // 灰色（已知不可用）的模型也一起勾上：
                    // 用户点分组框就是想「这一组全测一遍」，包括复测那些标灰的
                    // （升级套餐后、或者上一次是临时额度问题，都可能已经恢复）。
                    boxes[i].checked = el.checked;
                }
                updateProbeSelection();
            }

            function updateProbeSelection() {
                const selected = getSelectedProbeModels();
                const countEl = document.getElementById('modelPickCount');
                const startBtn = document.getElementById('modelTestStartBtn');
                const costHint = document.getElementById('modelTestCostHint');
                const allEl = document.getElementById('modelPickAll');

                if (countEl) countEl.textContent = '已选 ' + selected.length + ' 个';
                if (startBtn) {
                    startBtn.disabled = selected.length === 0;
                    startBtn.textContent = selected.length ? '开始测试（' + selected.length + ' 个）' : '开始测试';
                }
                if (costHint) {
                    // 不写具体数字：上游按输入 token 计费，探针只有几十个 token，
                    // 多数情况实际扣 0，偶尔几分钱。给个假精确值反而误导。
                    costHint.textContent = selected.length
                        ? '将发送 ' + selected.length + ' 次最小请求，会少量消耗积分'
                        : '未勾选任何模型时不发请求';
                }
                if (allEl) {
                    const total = document.querySelectorAll('input.model-pick').length;
                    allEl.checked = selected.length > 0 && selected.length === total;
                    allEl.indeterminate = selected.length > 0 && selected.length < total;
                }

                // 分组框跟着组内全部模型（含灰色）的勾选情况走：全选/半选/空。
                // 灰色模型也参与计算，否则点了分组框把灰的也勾上之后，
                // 分组框自己反倒显示成半选，看着像没生效。
                var vendorBoxes = document.querySelectorAll('input.vendor-pick');
                for (var i = 0; i < vendorBoxes.length; i++) {
                    var v = vendorBoxes[i].getAttribute('data-vendor');
                    var items = document.querySelectorAll('input.model-pick[data-vendor="' + v + '"]');
                    var total = items.length;
                    var checkedCount = 0;
                    for (var j = 0; j < total; j++) {
                        if (items[j].checked) checkedCount++;
                    }
                    vendorBoxes[i].checked = total > 0 && checkedCount === total;
                    vendorBoxes[i].indeterminate = checkedCount > 0 && checkedCount < total;
                }
            }

            /**
             * 全选 / 全不选
             *
             * 包含灰色的模型：全选就是字面意义上的全选，
             * 想跳过灰色的可以自己取消勾选。
             */
            function toggleAllProbeModels(checked) {
                var boxes = document.querySelectorAll('input.model-pick');
                for (var i = 0; i < boxes.length; i++) {
                    boxes[i].checked = checked;
                }
                updateProbeSelection();
            }

            function probeMemoryKey(index) {
                return 'codebuddy-probe-models-' + index;
            }

            function loadRememberedProbeModels(index) {
                try {
                    const raw = localStorage.getItem(probeMemoryKey(index));
                    const arr = raw ? JSON.parse(raw) : [];
                    return new Set(Array.isArray(arr) ? arr : []);
                } catch {
                    return new Set();
                }
            }

            function saveRememberedProbeModels(index, models) {
                try {
                    localStorage.setItem(probeMemoryKey(index), JSON.stringify(models.slice(0, 50)));
                } catch {
                    /* localStorage 不可用时忽略 */
                }
            }

            /**
             * 开始测试：把勾选的模型发给后端，结果通过 SSE 逐条推回来
             */
            function startModelTest() {
                const models = getSelectedProbeModels();
                if (models.length === 0) {
                    showToast('请先勾选要测试的模型', 'error');
                    return;
                }
                saveRememberedProbeModels(modelTestIndex, models);

                const bodyEl = document.getElementById('modelTestBody');
                const summaryEl = document.getElementById('modelTestSummary');
                const barEl = document.getElementById('modelTestProgressBar');
                const startBtn = document.getElementById('modelTestStartBtn');
                const costHint = document.getElementById('modelTestCostHint');

                bodyEl.innerHTML = '<div class="empty-state"><p>正在测试... <span class="loading"></span></p></div>';
                summaryEl.textContent = '';
                barEl.style.width = '0';
                startBtn.style.display = 'none';
                costHint.textContent = '';

                const rows = new Map();
                let total = models.length;
                let done = 0;

                const render = () => {
                    const list = Array.from(rows.values());
                    if (list.length === 0) return;
                    list.sort((a, b) => {
                        const rank = (r) => (r.status === 'ok' ? 0 : r.status === 'model_unavailable' ? 2 : 1);
                        return rank(a) - rank(b) || a.model.localeCompare(b.model);
                    });
                    let html = '<table class="guide-model-table"><thead><tr><th>模型</th><th>结果</th><th>说明</th><th>耗时</th></tr></thead><tbody>';
                    for (const r of list) {
                        const color = r.status === 'ok' ? '#059669' : r.blameModel ? '#dc2626' : '#b45309';
                        html += '<tr>' +
                            '<td><code>' + escapeHtml(r.model) + '</code></td>' +
                            '<td style="color:' + color + ';font-weight:600;">' + escapeHtml(r.label) + '</td>' +
                            '<td style="color:#6b7280;">' + escapeHtml(r.detail || '') + '</td>' +
                            '<td>' + (r.elapsedMs ? (r.elapsedMs / 1000).toFixed(1) + 's' : '—') + '</td>' +
                            '</tr>';
                    }
                    html += '</tbody></table>';
                    bodyEl.innerHTML = html;
                };

                const controller = new AbortController();
                modelTestAbort = controller;

                fetch(API_BASE + '/credentials/test-models', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({index: modelTestIndex, models: models}),
                    signal: controller.signal
                })
                    .then((response) => {
                        if (!response.ok) {
                            return response.json().then((d) => {
                                throw new Error(d.error || '测试失败（HTTP ' + response.status + '）');
                            });
                        }
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';

                        const pump = () => reader.read().then(({done: finished, value}) => {
                            if (finished) return;
                            buffer += decoder.decode(value, {stream: true});

                            let sep;
                            while ((sep = buffer.indexOf('\n\n')) !== -1) {
                                const rawEvent = buffer.slice(0, sep);
                                buffer = buffer.slice(sep + 2);
                                const evLines = rawEvent.split('\n');
                                let eventName = 'message';
                                let dataLine = '';
                                for (const line of evLines) {
                                    if (line.indexOf('event: ') === 0) eventName = line.slice(7).trim();
                                    else if (line.indexOf('data: ') === 0) dataLine += line.slice(6);
                                }
                                if (!dataLine) continue;
                                let payload;
                                try { payload = JSON.parse(dataLine); } catch (e) { continue; }

                                if (eventName === 'start') {
                                    total = payload.total || models.length;
                                } else if (eventName === 'result') {
                                    rows.set(payload.model, payload);
                                    done = payload.done || rows.size;
                                    barEl.style.width = total ? Math.round((done / total) * 100) + '%' : '0';
                                    render();
                                } else if (eventName === 'done') {
                                    barEl.style.width = '100%';
                                    const s = payload.summary || {};
                                    let text =
                                        '<strong>' + (s.ok || 0) + '</strong> 个可用 · ' +
                                        '<span style="color:#dc2626;">' + (s.failed || 0) + '</span> 个模型不可用 · ' +
                                        '<span style="color:#b45309;">' + (s.unknown || 0) + '</span> 个测不出（渠道/网络，不代表模型坏）';
                                    if (s.notTested) {
                                        text += ' · <span style="color:#6b7280;">' + s.notTested + ' 个未测试</span>';
                                    }
                                    if (s.totalCredit) {
                                        text += ' · 实际消耗 ' + s.totalCredit.toFixed(3) + ' credits';
                                    }
                                    if (payload.aborted && payload.abortReason) {
                                        text += '<div style="margin-top:6px;color:#b45309;font-size:0.8rem;">' +
                                            escapeHtml(payload.abortReason) + '</div>';
                                    }
                                    text += '<div style="margin-top:6px;font-size:0.78rem;color:#9ca3af;">' +
                                        '测试时间 ' + new Date().toLocaleTimeString('zh-CN') +
                                        ' · 6004/11102 这类「用量超限」通常是临时的，过几分钟可以重测</div>';
                                    summaryEl.innerHTML = text;
                                    startBtn.style.display = 'inline-flex';
                                    startBtn.textContent = '重新测试';
                                } else if (eventName === 'error') {
                                    summaryEl.innerHTML = '<span style="color:#dc2626;">探测中断：' +
                                        escapeHtml(payload.message || '') + '</span>';
                                    startBtn.style.display = 'inline-flex';
                                }
                            }
                            return pump();
                        }).catch((err) => {
                            if (err.name === 'AbortError') return;
                            summaryEl.innerHTML = '<span style="color:#dc2626;">连接中断：' +
                                escapeHtml(err.message) + '</span>';
                            startBtn.style.display = 'inline-flex';
                        });

                        return pump();
                    })
                    .catch((error) => {
                        if (error.name === 'AbortError') return;
                        bodyEl.innerHTML = '<div class="empty-state"><p style="color:#dc2626;">' +
                            escapeHtml(error.message) + '</p></div>';
                        startBtn.style.display = 'inline-flex';
                    });
            }

            function closeModelTest() {
                if (modelTestAbort) {
                    try { modelTestAbort.abort(); } catch {}
                    modelTestAbort = null;
                }
                const modal = document.getElementById('modelTestModal');
                if (modal) modal.style.display = 'none';
                modelTestIndex = null;
            }

            function updateGuideConfig() {
                const baseUrl = window.location.origin;
                const el = document.getElementById('guideConfigCode');
                if (!el) return;
                el.textContent = `{
  "env": {
    "ANTHROPIC_AUTH_TOKEN": "${apiKeyPlain || apiKeyMasked}",
    "ANTHROPIC_BASE_URL": "${baseUrl}/codebuddy/anthropic",
    "ANTHROPIC_DEFAULT_HAIKU_MODEL": "glm-5.1",
    "ANTHROPIC_DEFAULT_SONNET_MODEL": "glm-5.1",
    "ANTHROPIC_DEFAULT_OPUS_MODEL": "glm-5.0"
  }
}`;
                const openaiUrlEl = document.getElementById('guideOpenAIUrl');
                if (openaiUrlEl) {
                    openaiUrlEl.textContent = `${baseUrl}/codebuddy/v1`;
                }
                const responsesUrlEl = document.getElementById('guideResponsesUrl');
                if (responsesUrlEl) {
                    responsesUrlEl.textContent = `${baseUrl}/codebuddy/v1`;
                }
            }

            function copyGuideConfig() {
                const el = document.getElementById('guideConfigCode');
                if (!el) return;
                copyGuideText(el.textContent);
            }

            function copyGuideOpenAIUrl() {
                const el = document.getElementById('guideOpenAIUrl');
                if (!el) return;
                copyGuideText(el.textContent);
            }

            function copyGuideResponsesUrl() {
                const el = document.getElementById('guideResponsesUrl');
                if (!el) return;
                copyGuideText(el.textContent);
            }

            function copyGuideText(text) {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(text);
                    } else {
                        const textarea = document.createElement('textarea');
                        textarea.value = text;
                        textarea.style.cssText = 'position:fixed;left:-9999px;opacity:0';
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                    }
                    showToast('已复制');
                } catch {
                    showToast('复制失败', 'error');
                }
            }

            async function resetApiKey(id) {
                const key = findApiKey(id);
                if (!confirm('重置「' + (key ? key.label : id) + '」的 Key？它的旧明文会立即失效，其它 Key 不受影响。')) return;
                try {
                    const response = await fetch(API_BASE + '/api-keys/regenerate', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({id})
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || '重置失败');
                    apiKeyRevealed.add(id);
                    await loadApiKeys();
                    showToast('Key 已重置，新明文已展开');
                } catch (error) {
                    showToast('重置失败: ' + error.message, 'error');
                }
            }

            window.addEventListener('resize', function () {
                if (apiCallsChartInstance) apiCallsChartInstance.resize();
                if (tokensChartInstance) tokensChartInstance.resize();
                if (creditChartInstance) creditChartInstance.resize();
            });

            loadMyTenant();
        </script>
    </body>
